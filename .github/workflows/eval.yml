name: AI eval

on:
  workflow_dispatch:
  push:
    paths: 
      - 'prompts/**'
      - 'skills/**'
      - 'tools/**'
      - 'chat.js'
      - 'agentResponse.js'
      - 'reviewProtocol.js'
      - 'skill*.js'
      - 'tool*.js'
      - 'three-agent-eval/**'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node three-agent-eval/run-eval.mjs --project . --limit 12 --interval-ms 60000
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: eval-results
          path: three-agent-eval/raw-results.json
        
          
          
           
